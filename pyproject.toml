[project]
name = "la-goyniela-api"
version = "0.1.0"
description = "La Goyniela — backend API for a La Quiniela group organizer"
requires-python = ">=3.11"
readme = "readme.md"

dependencies = [
    "fastapi>=0.110,<0.120",
    "uvicorn[standard]>=0.27,<0.30",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<0.30",
    "tenacity>=8.2,<9.0",
    "structlog>=24.1,<25.0",
    "apscheduler>=3.10,<4.0",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",
    "google-auth>=2.27,<3.0",
    "requests>=2.31,<3.0",
    "pydantic[email]>=2.6,<3.0",
    "boto3>=1.34,<2.0",
    "python-multipart>=0.0.32",
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-httpx>=0.30,<1.0",
    "testcontainers[postgres]>=4.7,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
